[project]
name = "judgetrust"
version = "0.1.0"
description = "LLM-as-judge evaluation with judge validation (Judge Trust)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.16",
    "langchain-openai>=1.6.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "streamlit>=1.62.0",
]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["judgetrust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
